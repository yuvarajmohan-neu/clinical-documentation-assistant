[project]
name = "cda-backend"
version = "0.1.0"
description = "Clinical Documentation Assistant — backend (P2 slice: auth, db, audit)"
requires-python = ">=3.11"
dependencies = [
  "sqlmodel>=0.0.21",
  "psycopg[binary]>=3.1",
  "pydantic-settings>=2.4",
  "PyJWT[crypto]>=2.9",
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
